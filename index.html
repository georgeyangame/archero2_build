<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アーチャー伝説2 ビルド共有</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 10px; }
        .hero-card.selected { border-color: #4ade80; background: rgba(74, 222, 128, 0.1); }
        .inherit-card.selected { border-color: #60a5fa; background: rgba(96, 165, 250, 0.1); }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen pb-10">

    <header class="p-4 text-center border-b border-slate-800 bg-[#1e293b] sticky top-0 z-50">
        <h1 class="text-xl font-black text-green-500 tracking-wider italic">ARCHER 2 BUILDER</h1>
        <p class="text-[10px] text-slate-400">CLAN EXCLUSIVE TOOLS</p>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-8">
        
        <section>
            <div class="flex items-center mb-3">
                <span class="w-1 h-4 bg-green-500 mr-2"></span>
                <h2 class="text-sm font-bold uppercase tracking-widest text-slate-300">Main Hero</h2>
            </div>
            <div id="main-hero-grid" class="grid grid-cols-4 gap-2">
                </div>
        </section>

        <section class="space-y-6">
            <div>
                <div class="flex items-center mb-3">
                    <span class="w-1 h-4 bg-blue-500 mr-2"></span>
                    <h2 class="text-sm font-bold uppercase tracking-widest text-slate-300">Inherit 1</h2>
                </div>
                <div id="inherit1-grid" class="flex overflow-x-auto gap-2 pb-2 custom-scrollbar">
                    </div>
            </div>

            <div>
                <div class="flex items-center mb-3">
                    <span class="w-1 h-4 bg-blue-500 mr-2"></span>
                    <h2 class="text-sm font-bold uppercase tracking-widest text-slate-300">Inherit 2</h2>
                </div>
                <div id="inherit2-grid" class="flex overflow-x-auto gap-2 pb-2 custom-scrollbar">
                    </div>
            </div>
        </section>

        <section class="pt-4 border-t border-slate-800">
            <h2 class="text-xs font-bold text-slate-500 mb-4 text-center">EQUIPMENT SLOTS</h2>
            <div class="grid grid-cols-3 gap-3">
                <div class="aspect-square bg-slate-800/50 rounded-xl border border-slate-700 flex flex-col items-center justify-center text-[10px] text-slate-500 italic"><span>Weapon</span></div>
                <div class="aspect-square bg-slate-800/50 rounded-xl border border-slate-700 flex flex-col items-center justify-center text-[10px] text-slate-500 italic"><span>Amulet</span></div>
                <div class="aspect-square bg-slate-800/50 rounded-xl border border-slate-700 flex flex-col items-center justify-center text-[10px] text-slate-500 italic"><span>Ring</span></div>
                <div class="aspect-square bg-slate-800/50 rounded-xl border border-slate-700 flex flex-col items-center justify-center text-[10px] text-slate-500 italic"><span>Helmet</span></div>
                <div class="aspect-square bg-slate-800/50 rounded-xl border border-slate-700 flex flex-col items-center justify-center text-[10px] text-slate-500 italic"><span>Armor</span></div>
                <div class="aspect-square bg-slate-800/50 rounded-xl border border-slate-700 flex flex-col items-center justify-center text-[10px] text-slate-500 italic"><span>Boots</span></div>
            </div>
        </section>

    </main>

    <footer class="fixed bottom-0 left-0 w-full p-4 bg-[#1e293b]/90 backdrop-blur-md border-t border-slate-700">
        <button class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-full shadow-lg transition-transform active:scale-95">
            ビルドを共有する
        </button>
    </footer>

    <script>
        const heroes = [
            { name: "アレックス", img: "alex.png" },
            { name: "ネコ忍者", img: "nyanja.png" },
            { name: "ヘリックス", img: "helix.png" },
            { name: "ヘラ", img: "hela.png" },
            { name: "ミーラ", img: "mymu.png" },
            { name: "神眷の者", img: "seraph.png" },
            { name: "ドラクーラ", img: "dracoola.png" },
            { name: "ローラ", img: "rolla.png" },
            { name: "ロキ", img: "loki.png" },
            { name: "フィンクス", img: "phynx.png" },
            { name: "オッタ", img: "otta.png" },
            { name: "魔王アトレウス", img: "DKatreus.png" },
            { name: "ソー", img: "thor.png" },
            { name: "クレオ", img: "cleo.png" }
        ];

        // メインキャラクター選択用
        const mainGrid = document.getElementById('main-hero-grid');
        heroes.forEach(hero => {
            const div = document.createElement('div');
            div.className = "hero-card cursor-pointer bg-slate-800 p-1 rounded-lg border-2 border-transparent transition-all";
            div.innerHTML = `
                <img src="assets/${hero.img}" class="w-full aspect-square object-cover rounded-md" alt="${hero.name}">
                <p class="text-[8px] text-center mt-1 truncate">${hero.name}</p>
            `;
            div.onclick = () => {
                document.querySelectorAll('.hero-card').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
            };
            mainGrid.appendChild(div);
        });

        // 継承選択用 (横スクロール形式)
        const createInheritGrid = (elementId) => {
            const grid = document.getElementById(elementId);
            heroes.forEach(hero => {
                const div = document.createElement('div');
                div.className = "inherit-card flex-shrink-0 w-16 cursor-pointer bg-slate-800 p-1 rounded-lg border-2 border-transparent transition-all";
                div.innerHTML = `
                    <img src="assets/${hero.img}" class="w-full aspect-square object-cover rounded-md" alt="${hero.name}">
                    <p class="text-[8px] text-center mt-1 truncate">${hero.name}</p>
                `;
                div.onclick = () => {
                    document.querySelectorAll(`#${elementId} .inherit-card`).forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                };
                grid.appendChild(div);
            });
        };

        createInheritGrid('inherit1-grid');
        createInheritGrid('inherit2-grid');
    </script>
</body>
</html>
