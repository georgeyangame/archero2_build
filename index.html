<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アーチャー伝説2 ビルド共有</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-4">
    <h1 class="text-xl font-bold border-b border-green-500 mb-4">Archer2 Build Clan</h1>
    
    <div class="grid grid-cols-1 gap-4">
        <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
            <p class="text-sm text-green-400 mb-2">Main Character</p>
            <select class="bg-slate-700 w-full p-2 rounded">
                <option>選択してください</option>
                <option>キャラ1</option>
                <option>キャラ2</option>
                </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <div class="bg-slate-800 p-2 rounded border border-slate-700 text-center">武器</div>
            <div class="bg-slate-800 p-2 rounded border border-slate-700 text-center">アミュレット</div>
        </div>
    </div>
    
    <button class="mt-6 w-full bg-green-600 p-3 rounded-full font-bold">ビルドを共有する</button>
</body>
</html>
