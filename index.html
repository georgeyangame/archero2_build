<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アーチャー伝説2 ビルド共有</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .selected-border { border-color: #4ade80 !important; background: rgba(74, 222, 128, 0.1); }
        .rune-slot { aspect-ratio: 1/1; background: #1e293b; border: 2px solid #334155; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen pb-32 font-sans">

    <header class="p-4 text-center border-b border-slate-800 bg-[#1e293b] sticky top-0 z-50">
        <h1 class="text-xl font-black text-green-500 tracking-wider italic">ARCHER 2 BUILDER</h1>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-8">
        
        <section>
            <h2 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest flex items-center"><span class="w-1 h-3 bg-green-500 mr-2"></span>Characters</h2>
            <div class="grid grid-cols-3 gap-3">
                <div onclick="openHeroModal('main')" id="slot-main" class="rune-slot"><span class="text-[10px] text-slate-500">メイン</span></div>
                <div onclick="openHeroModal('inherit1')" id="slot-inherit1" class="rune-slot"><span class="text-[10px] text-slate-500">継承1</span></div>
                <div onclick="openHeroModal('inherit2')" id="slot-inherit2" class="rune-slot"><span class="text-[10px] text-slate-500">継承2</span></div>
            </div>
        </section>

        <section>
            <h2 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest flex items-center"><span class="w-1 h-3 bg-yellow-500 mr-2"></span>Equipment</h2>
            <div class="grid grid-cols-2 gap-3">
                <div onclick="openEquipModal('weapon')" id="slot-weapon" class="rune-slot h-20 text-[10px] text-slate-500">武器</div>
                <div onclick="openEquipModal('helmet')" id="slot-helmet" class="rune-slot h-20 text-[10px] text-slate-500">兜</div>
                <div onclick="openEquipModal('amulet')" id="slot-amulet" class="rune-slot h-20 text-[10px] text-slate-500">アミュレット</div>
                <div onclick="openEquipModal('armor')" id="slot-armor" class="rune-slot h-20 text-[10px] text-slate-500">鎧</div>
                <div onclick="openEquipModal('ring')" id="slot-ring" class="rune-slot h-20 text-[10px] text-slate-500">指輪</div>
                <div onclick="openEquipModal('boots')" id="slot-boots" class="rune-slot h-20 text-[10px] text-slate-500">靴</div>
            </div>
        </section>

        <section class="space-y-6">
            <h2 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest flex items-center"><span class="w-1 h-3 bg-purple-500 mr-2"></span>Runes</h2>
            
            <div>
                <p class="text-[10px] text-purple-400 mb-2 ml-1">強化ルーン (4枠)</p>
                <div class="grid grid-cols-4 gap-2">
                    <div onclick="openRuneModal('E', 0)" id="slot-E-0" class="rune-slot text-[8px] text-slate-600 italic">E1</div>
                    <div onclick="openRuneModal('E', 1)" id="slot-E-1" class="rune-slot text-[8px] text-slate-600 italic">E2</div>
                    <div onclick="openRuneModal('E', 2)" id="slot-E-2" class="rune-slot text-[8px] text-slate-600 italic">E3</div>
                    <div onclick="openRuneModal('E', 3)" id="slot-E-3" class="rune-slot text-[8px] text-slate-600 italic">E4</div>
                </div>
            </div>

            <div>
                <p class="text-[10px] text-blue-400 mb-2 ml-1">能力ルーン (4枠)</p>
                <div class="grid grid-cols-4 gap-2">
                    <div onclick="openRuneModal('A', 0)" id="slot-A-0" class="rune-slot text-[8px] text-slate-600 italic">A1</div>
                    <div onclick="openRuneModal('A', 1)" id="slot-A-1" class="rune-slot text-[8px] text-slate-600 italic">A2</div>
                    <div onclick="openRuneModal('A', 2)" id="slot-A-2" class="rune-slot text-[8px] text-slate-600 italic">A3</div>
                    <div onclick="openRuneModal('A', 3)" id="slot-A-3" class="rune-slot text-[8px] text-slate-600 italic">A4</div>
                </div>
            </div>

            <div>
                <p class="text-[10px] text-pink-400 mb-2 ml-1">祝福ルーン (2枠)</p>
                <div class="grid grid-cols-4 gap-2">
                    <div onclick="openRuneModal('B', 0)" id="slot-B-0" class="rune-slot text-[8px] text-slate-600 italic">B1</div>
                    <div onclick="openRuneModal('B', 1)" id="slot-B-1" class="rune-slot text-[8px] text-slate-600 italic">B2</div>
                </div>
            </div>

            <div>
                <p class="text-[10px] text-orange-400 mb-2 ml-1">銘刻ルーン (3枠)</p>
                <div class="grid grid-cols-4 gap-2">
                    <div onclick="openRuneModal('M', 0)" id="slot-M-0" class="rune-slot text-[8px] text-slate-600 italic">M1</div>
                    <div onclick="openRuneModal('M', 1)" id="slot-M-1" class="rune-slot text-[8px] text-slate-600 italic">M2</div>
                    <div onclick="openRuneModal('M', 2)" id="slot-M-2" class="rune-slot text-[8px] text-slate-600 italic">M3</div>
                </div>
            </div>
        </section>
    </main>

    <div id="heroModal" class="modal px-4" onclick="this.classList.remove('active')">
        <div class="bg-slate-800 w-full max-w-md rounded-3xl p-4 max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div id="hero-selection-grid" class="grid grid-cols-4 gap-2"></div>
        </div>
    </div>

    <div id="equipModal" class="modal px-6" onclick="this.classList.remove('active')">
        <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6" onclick="event.stopPropagation()">
            <div class="grid grid-cols-1 gap-4">
                <button onclick="selectSeries('D')" class="flex items-center bg-slate-700 p-3 rounded-2xl">
                    <img id="img-D" class="w-12 h-12 mr-4 object-contain"><span class="font-bold">ドラグーン</span>
                </button>
                <button onclick="selectSeries('O')" class="flex items-center bg-slate-700 p-3 rounded-2xl">
                    <img id="img-O" class="w-12 h-12 mr-4 object-contain"><span class="font-bold">神託</span>
                </button>
                <button onclick="selectSeries('G')" class="flex items-center bg-slate-700 p-3 rounded-2xl">
                    <img id="img-G" class="w-12 h-12 mr-4 object-contain"><span class="font-bold">グリフォン</span>
                </button>
            </div>
        </div>
    </div>

    <div id="runeModal" class="modal px-4" onclick="this.classList.remove('active')">
        <div class="bg-slate-800 w-full max-w-md rounded-3xl p-4 max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
            <h3 class="text-center font-bold mb-4 text-purple-400">ルーンを選択</h3>
            <div id="rune-selection-grid" class="grid grid-cols-4 gap-2"></div>
        </div>
    </div>

    <footer class="fixed bottom-0 left-0 w-full p-4 bg-[#1e293b]/90 backdrop-blur-md border-t border-slate-700 z-50">
        <button id="share-btn" onclick="generateShareUrl()" class="w-full bg-green-600 py-3 rounded-full font-bold shadow-lg active:scale-95 transition-transform">
        ビルドを共有する
        </button>
    </footer>

    <script>
        const heroes = [
            { name: "アレックス", img: "alex.png" }, { name: "ネコ忍者", img: "nyanja.png" },
            { name: "ヘリックス", img: "helix.png" }, { name: "ヘラ", img: "hela.png" },
            { name: "ミーラ", img: "mymu.png" }, { name: "神眷の者", img: "seraph.png" },
            { name: "ドラクーラ", img: "dracoola.png" }, { name: "ローラ", img: "rolla.png" },
            { name: "ロキ", img: "loki.png" }, { name: "フィンクス", img: "phynx.png" },
            { name: "オッタ", img: "otta.png" }, { name: "魔王アトレウス", img: "DKatreus.png" },
            { name: "ソー", img: "thor.png" }, { name: "クレオ", img: "cleo.png" }
        ];
        
        // 状態管理
        let selections = {
            hero: { main: '', inherit1: '', inherit2: '' },
            equip: { weapon: '', helmet: '', amulet: '', armor: '', ring: '', boots: '' },
            runes: { E: [null,null,null,null], A: [null,null,null,null], B: [null,null], M: [null,null,null] }
        };
        
        let currentHeroSlot = '', currentEquipSlot = '', currentRuneType = '', currentRuneIdx = '';
        
        // --- 表示更新用関数 ---
        function renderHero(slot, img) {
            const s = document.getElementById(`slot-${slot}`);
            if (!s) return;
            const hero = heroes.find(h => h.img === img);
            const name = hero ? hero.name : "";
            s.innerHTML = `<img src="assets/${img}" class="w-full rounded-md shadow-lg">
                           <p class="text-[8px] mt-1 text-green-400 font-bold">${name}</p>`;
            s.classList.add('selected-border');
        }
        
        function renderEquip(slot, img) {
            const s = document.getElementById(`slot-${slot}`);
            if (!s) return;
            s.innerHTML = `<img src="assets/${img}" class="h-full object-contain">`;
            s.classList.add('selected-border');
        }
        
        function renderRune(type, idx, img) {
            const s = document.getElementById(`slot-${type}-${idx}`);
            if (!s) return;
            s.innerHTML = `<img src="assets/${img}" class="w-full rounded-md">`;
            s.classList.add('selected-border');
        }
        
        // --- ヒーロー選択 ---
        function openHeroModal(slot) {
            currentHeroSlot = slot;
            const grid = document.getElementById('hero-selection-grid');
            grid.innerHTML = '';
            heroes.forEach(hero => {
                const div = document.createElement('div');
                div.className = "cursor-pointer bg-slate-700 p-1 rounded-lg border-2 border-transparent hover:border-green-500";
                div.innerHTML = `<img src="assets/${hero.img}" class="w-full aspect-square object-cover rounded-md">
                                 <p class="text-[8px] text-center mt-1 truncate">${hero.name}</p>`;
                div.onclick = () => {
                    selections.hero[currentHeroSlot] = hero.img;
                    renderHero(currentHeroSlot, hero.img);
                    document.getElementById('heroModal').classList.remove('active');
                };
                grid.appendChild(div);
            });
            document.getElementById('heroModal').classList.add('active');
        }
        
        // --- 装備選択 ---
        function openEquipModal(slot) {
            currentEquipSlot = slot;
            document.getElementById('img-D').src = `assets/D_${slot}.png`;
            document.getElementById('img-O').src = `assets/O_${slot}.png`;
            document.getElementById('img-G').src = `assets/G_${slot}.png`;
            document.getElementById('equipModal').classList.add('active');
        }
        
        function selectSeries(series) {
            const imgName = `${series}_${currentEquipSlot}.png`;
            selections.equip[currentEquipSlot] = imgName;
            renderEquip(currentEquipSlot, imgName);
            document.getElementById('equipModal').classList.remove('active');
        }
        
        // --- ルーン選択 ---
        const runeCounts = { E: 12, A: 12, B: 6, M: 9 };
        function openRuneModal(type, idx) {
            currentRuneType = type;
            currentRuneIdx = idx;
            const grid = document.getElementById('rune-selection-grid');
            grid.innerHTML = '';
            for(let i=0; i <= runeCounts[type]; i++) {
                const d = document.createElement('div');
                d.className = "bg-slate-700 p-1 rounded-lg border-2 border-transparent";
                d.innerHTML = `<img src="assets/rune_${type}${i}.jpg" class="w-full aspect-square rounded-md">`;
                d.onclick = () => {
                    const imgName = `rune_${type}${i}.jpg`;
                    selections.runes[currentRuneType][currentRuneIdx] = imgName;
                    renderRune(currentRuneType, currentRuneIdx, imgName);
                    document.getElementById('runeModal').classList.remove('active');
                };
                grid.appendChild(d);
            }
            document.getElementById('runeModal').classList.add('active');
        }
        
        // --- URL生成 ---
        function generateShareUrl() {
            const data = btoa(JSON.stringify(selections));
            const url = `${window.location.origin}${window.location.pathname}?b=${data}`;
            navigator.clipboard.writeText(url).then(() => {
                alert("ビルドURLをコピーしました！");
            });
        }
        
        // --- 復元実行 ---
        function loadBuildFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const buildData = params.get('b');
            if (!buildData) return;
            try {
                const decoded = JSON.parse(atob(buildData));
                selections = decoded;
                
                // ヒーロー復元
                Object.keys(selections.hero).forEach(s => {
                    if (selections.hero[s]) renderHero(s, selections.hero[s]);
                });
                // 装備復元
                Object.keys(selections.equip).forEach(s => {
                    if (selections.equip[s]) renderEquip(s, selections.equip[s]);
                });
                // ルーン復元
                Object.keys(selections.runes).forEach(t => {
                    selections.runes[t].forEach((img, i) => {
                        if (img) renderRune(t, i, img);
                    });
                });
            } catch(e) {
                console.error("復元失敗:", e);
            }
        }
        
        // ページ読み込み完了時に実行
        document.addEventListener('DOMContentLoaded', loadBuildFromUrl);
    </script>
</body>
</html>
